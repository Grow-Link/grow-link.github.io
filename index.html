<style>
/* Concepto: una barra fija que cambia entre los dos documentos. Cada documento vive aislado en su iframe y tiene su propio color:
   01 Arquitectura en azul, 02 Historias de usuario en teal. La línea bajo la barra toma el color del documento abierto. */
:root {
  --bg: #F7F9FA; --card: #FFFFFF; --card2: #EEF2F6; --text: #0B1F3A; --text2: #566683; --line: #DDE4ED;
  --blue: #1E73E8; --teal: #0B9F8A; --blue-soft: #E3EEFD; --teal-soft: #DDF5F0; --onblue: #FFFFFF;
  --display: 'Bricolage Grotesque', 'Segoe UI', sans-serif; --body: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; --mono: 'JetBrains Mono', Consolas, monospace;
  --accent: var(--blue);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #081629; --card: #0F2240; --card2: #132A47; --text: #E2EBF6; --text2: #9DB3CE; --line: #1C3254;
  --blue: #5AA0FF; --teal: #12C2A8; --blue-soft: #14325E; --teal-soft: #0F3A3E; --onblue: #06182F; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #081629; --card: #0F2240; --card2: #132A47; --text: #E2EBF6; --text2: #9DB3CE; --line: #1C3254;
  --blue: #5AA0FF; --teal: #12C2A8; --blue-soft: #14325E; --teal-soft: #0F3A3E; --onblue: #06182F; color-scheme: dark; }
:root[data-doc="hu"] { --accent: var(--teal); }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* barra de documentos */
header.shell { flex: none; display: flex; align-items: center; gap: 10px 20px; flex-wrap: wrap; padding: 10px 16px; background: var(--card); border-bottom: 3px solid var(--accent); transition: border-color .2s; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; min-width: 0; }
.brand img { height: 36px; width: auto; flex: none; }
.brand b { font-family: var(--display); font-size: 19px; font-weight: 800; letter-spacing: -0.01em; display: block; line-height: 1.1; }
.brand span { color: var(--text2); font-size: 12.5px; }

.docs { display: flex; gap: 8px; }
.doc { --c: var(--blue); --cs: var(--blue-soft); display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 6px 16px 6px 7px; transition: border-color .15s, background .15s; }
.doc[data-doc="hu"] { --c: var(--teal); --cs: var(--teal-soft); }
.doc:hover { border-color: var(--c); }
.doc .ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none; background: var(--card2); color: var(--c); transition: background .15s, color .15s; }
.doc small { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--c); line-height: 1.3; }
.doc b { display: block; font-family: var(--display); font-size: 15.5px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
.doc[aria-selected="true"] { border-color: var(--c); background: var(--cs); }
.doc[aria-selected="true"] .ic { background: var(--c); color: var(--onblue); }

#theme { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: 13px; }

/* documentos */
main { flex: 1; min-height: 0; position: relative; }
.pane { position: absolute; inset: 0; }
.pane[hidden] { display: none; }
.pane iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }

@media (max-width: 700px) {
  .brand span { display: none; }
  .docs { order: 3; width: 100%; }
  .doc { flex: 1; min-width: 0; }
  .doc b { font-size: 14.5px; white-space: normal; }
}
</style>
<script>
/* Va en el head para que exista antes que los iframes y no se pierda su evento load.
   El tema queda sincronizado en las tres páginas: sirve tanto el botón de arriba como el "Tema" de cada documento. */
(function () {
  var root = document.documentElement, KEY = "gl-theme";
  try { var pref = localStorage.getItem(KEY); if (pref) root.setAttribute("data-theme", pref); } catch (e) {}

  function frameRoots() {
    return Array.prototype.map.call(document.querySelectorAll(".pane iframe"), function (f) {
      return f.contentDocument && f.contentDocument.documentElement;
    }).filter(Boolean);
  }
  window.glSetTheme = function (t) {
    if (root.getAttribute("data-theme") !== t) root.setAttribute("data-theme", t);

<style>
/* Concepto: una sola pantalla de presentacion. Pestañas arriba, el diagrama vivo a la izquierda y un panel que explica a la derecha.
   Colores y tipografias salen del propio front de GrowLink (navy, azul, teal, verde). */
:root {
  --bg: #F7F9FA; --card: #FFFFFF; --card2: #EEF2F6; --text: #0B1F3A; --text2: #566683; --line: #DDE4ED;
  --blue: #1E73E8; --teal: #0B9F8A; --green: #1F9D55; --edge: #8497B3; --nodefill: #FFFFFF; --nodestroke: #B9C6D8;
  --blue-soft: #E3EEFD; --teal-soft: #DDF5F0; --dots: #D6DEE9; --onblue: #FFFFFF;
  --display: 'Bricolage Grotesque', 'Segoe UI', sans-serif; --body: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; --mono: 'JetBrains Mono', Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme=&quot;light&quot;]) {
  --bg: #081629; --card: #0F2240; --card2: #132A47; --text: #E2EBF6; --text2: #9DB3CE; --line: #1C3254;
  --blue: #5AA0FF; --teal: #12C2A8; --green: #4CE07E; --edge: #5C7599; --nodefill: #132A47; --nodestroke: #2C4672;
  --blue-soft: #14325E; --teal-soft: #0F3A3E; --dots: #1A2F50; --onblue: #06182F; color-scheme: dark; } }
:root[data-theme=&quot;dark&quot;] {
  --bg: #081629; --card: #0F2240; --card2: #132A47; --text: #E2EBF6; --text2: #9DB3CE; --line: #1C3254;
  --blue: #5AA0FF; --teal: #12C2A8; --green: #4CE07E; --edge: #5C7599; --nodefill: #132A47; --nodestroke: #2C4672;
  --blue-soft: #14325E; --teal-soft: #0F3A3E; --dots: #1A2F50; --onblue: #06182F; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.55; margin: 0; padding-inline: 16px; padding-block: 0 48px; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1320px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--blue); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* encabezado */
header.top { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding-block: 18px 14px; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.brand .logo { height: 56px; width: auto; flex: none; }
.brand h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
.brand p { margin: 0; color: var(--text2); font-size: 13px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font-family: var(--mono); font-size: 11.5px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--text2); white-space: nowrap; }
.chip b { color: var(--text); font-weight: 600; }
#theme { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: 13px; }

nav.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 20px; }
nav.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 16px; font-weight: 600; font-size: 15px; color: var(--text2); white-space: nowrap; margin-bottom: -1px; }
nav.tabs button[aria-selected=&quot;true&quot;] { color: var(--text); border-bottom-color: var(--blue); }
nav.tabs button kbd { font-family: var(--mono); font-size: 10.5px; color: var(--text2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 6px; }

/* arquitectura */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 20px; align-items: start; }
@media (max-width: 1020px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.diagram { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px; overflow-x: auto;
  background-image: radial-gradient(var(--dots) 1px, transparent 1px); background-size: 22px 22px; }
.diagram svg { display: block; width: 100%; min-width: 760px; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--text2); margin: 10px 4px 0; }
.legend span::before { content: &quot;&quot;; display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--edge); vertical-align: middle; margin-right: 6px; }
.legend span.act::before { border-top: 2px dashed var(--teal); }

.node rect.body, .node path.body, .node polygon.body { fill: var(--nodefill); stroke: var(--nodestroke); stroke-width: 1.6; transition: stroke .15s, opacity .15s; }
.node rect.rep { fill: var(--nodefill); stroke: var(--nodestroke); stroke-width: 1.2; }
.node { cursor: pointer; transition: opacity .2s; }
.node:hover .body { stroke: var(--blue); }
.node.sel .body { stroke: var(--blue); stroke-width: 2.8; }
.node.on .body { stroke: var(--teal); stroke-width: 2.8; }
.node text { fill: var(--text); pointer-events: none; }
.node .tag { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; fill: var(--text2); text-transform: uppercase; }
.node .ttl { font-family: var(--display); font-weight: 700; font-size: 17px; }
.node .sub { font-size: 12px; fill: var(--text2); }
.node .ttl.sm { font-size: 14px; }
.node.on .tag { fill: var(--teal); }
.node:focus, .node:focus-visible { outline: none; }
.node:focus-visible .body { stroke: var(--blue); stroke-width: 3; }

.edge { fill: none; stroke: var(--edge); stroke-width: 1.6; transition: opacity .2s; }
.elabel { font-size: 11px; fill: var(--text2); paint-order: stroke; stroke: var(--card); stroke-width: 5px; stroke-linejoin: round; font-family: var(--mono); }
.edge.on { stroke: var(--teal); stroke-width: 2.6; stroke-dasharray: 7 6; animation: flow .7s linear infinite; }
.edge.on.rev { animation-direction: reverse; }
@keyframes flow { to { stroke-dashoffset: -26; } }
svg.focus .node:not(.on):not(.sel) { opacity: .5; }
svg.focus .edge:not(.on), svg.focus .elabel:not(.on) { opacity: .3; }
.elabel.on { fill: var(--teal); font-weight: 600; }
.ahead { fill: var(--edge); } .ahead-on { fill: var(--teal); }
@media (prefers-reduced-motion: reduce) { .edge.on { animation: none; } }

/* panel */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; position: sticky; top: 12px; min-height: 420px; }
@media (max-width: 1020px) { .panel { position: static; } }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--card2); border-radius: 10px; padding: 3px; margin-bottom: 16px; }
.seg button { border: 0; background: none; padding: 7px 10px; border-radius: 8px; font-weight: 600; font-size: 13.5px; color: var(--text2); }
.seg button[aria-pressed=&quot;true&quot;] { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(11,31,58,.15); }
.panel h2 { font-size: 22px; margin-bottom: 4px; }
.panel .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); margin-bottom: 6px; }
.panel p { margin: 8px 0; }
.panel ul { margin: 8px 0; padding-left: 18px; }
.panel li { margin: 4px 0; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 12px 0; font-size: 13.5px; }
.facts dt { color: var(--text2); } .facts dd { margin: 0; font-family: var(--mono); font-size: 12.5px; word-break: break-word; }
.sec { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text2); margin: 16px 0 6px; }
.links { list-style: none; padding: 0 !important; display: grid; gap: 6px; }
.links li { font-size: 13.5px; border-left: 3px solid var(--line); padding: 2px 0 2px 10px; margin: 0; }
.links li b { display: block; font-family: var(--mono); font-size: 12px; font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--card2); border-radius: 9px; padding: 7px 13px; font-weight: 600; font-size: 13.5px; }
.btn.pri { background: var(--blue); border-color: var(--blue); color: var(--onblue); }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.flowlist { display: grid; gap: 8px; margin-top: 4px; }
.flowlist button { text-align: left; border: 1px solid var(--line); background: var(--card2); border-radius: 10px; padding: 10px 12px; }
.flowlist button:hover { border-color: var(--blue); }
.flowlist button b { display: block; font-family: var(--display); font-size: 15px; }
.flowlist button span { font-size: 12.5px; color: var(--text2); }
.progress { display: flex; gap: 5px; margin: 10px 0 12px; }
.progress i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.progress i.done { background: var(--teal); opacity: .55; } .progress i.cur { background: var(--teal); }
.stepno { font-family: var(--mono); font-size: 12px; color: var(--text2); }
code, .mono { font-family: var(--mono); font-size: .88em; background: var(--card2); padding: 1px 6px; border-radius: 5px; }
.hint { color: var(--text2); font-size: 13px; }

/* calidad */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }
.qcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.qcard .kicker { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); }
.qcard h3 { font-size: 19px; margin: 4px 0 6px; }
.qcard p { margin: 0 0 8px; color: var(--text2); font-size: 14px; }
.qcard details { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; }
.qcard summary { cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--blue); }
.qcard ul { margin: 8px 0 0; padding-left: 18px; font-size: 13.5px; }
.qcard li { margin: 4px 0; }
.intro { max-width: 70ch; color: var(--text2); margin: 0 0 18px; }

/* despliegue */
.pipe { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; margin-bottom: 14px; }
@media (max-width: 760px) { .pipe { grid-template-columns: 1fr 1fr; gap: 8px; } }
.pipe button { position: relative; text-align: left; background: var(--card); border: 1px solid var(--line); padding: 12px 14px; margin-right: -1px; }
.pipe button:first-child { border-radius: 12px 0 0 12px; } .pipe button:last-child { border-radius: 0 12px 12px 0; margin-right: 0; }
@media (max-width: 760px) { .pipe button { border-radius: 12px !important; margin: 0; } }
.pipe button[aria-pressed=&quot;true&quot;] { background: var(--blue-soft); border-color: var(--blue); z-index: 1; }
.pipe small { display: block; font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--text2); }
.pipe b { font-family: var(--display); font-size: 16px; }
.dep { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 1020px) { .dep { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.card h3 { font-size: 19px; margin-bottom: 6px; }
.az { border: 2px dashed var(--nodestroke); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.az .lbl { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--text2); }
.az .inner { border: 1.5px dashed var(--nodestroke); border-radius: 10px; padding: 10px; display: grid; gap: 8px; }
.az .box { background: var(--nodefill); border: 1.5px solid var(--nodestroke); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; }
.az .box b { font-family: var(--display); font-size: 15px; display: block; }
.az .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 520px) { .az .two { grid-template-columns: 1fr; } }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--text2); font-weight: 600; }
td:first-child { font-family: var(--mono); font-size: 12px; word-break: break-word; }
.tblwrap { overflow-x: auto; }

footer { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; gap: 8px 18px; flex-wrap: wrap; font-size: 13px; color: var(--text2); }
[hidden] { display: none !important; }
</style>

      e.el.classList.remove(&quot;on&quot;, &quot;rev&quot;); e.el.setAttribute(&quot;marker-end&quot;, e.arrow === &quot;none&quot; ? &quot;&quot; : &quot;url(#ah)&quot;);
      if (e.arrow === &quot;both&quot;) e.el.setAttribute(&quot;marker-start&quot;, &quot;url(#ah)&quot;);
      e.labels.forEach(function (l) { l.classList.remove(&quot;on&quot;); });
    });
  }
  function setEdgeOn(e, dir) {
    e.el.classList.add(&quot;on&quot;);
    if (dir < 0) e.el.classList.add(&quot;rev&quot;);
    e.labels.forEach(function (l) { l.classList.add(&quot;on&quot;); });
  }
  function focusNode(id, selected) {
    clearFocus(); svg.classList.add(&quot;focus&quot;);
    NODES[id].el.classList.add(selected ? &quot;sel&quot; : &quot;on&quot;);
    EDGES.forEach(function (e) {
      if (e.a === id || e.b === id) { setEdgeOn(e, 1); NODES[e.a].el.classList.add(&quot;on&quot;); NODES[e.b].el.classList.add(&quot;on&quot;); }
    });
    if (selected) NODES[id].el.classList.remove(&quot;on&quot;), NODES[id].el.classList.add(&quot;sel&quot;);
  }
  function focusStep(step) {
    clearFocus(); svg.classList.add(&quot;focus&quot;);
    step.n.forEach(function (id) { NODES[id].el.classList.add(&quot;on&quot;); });
    step.e.forEach(function (pair) {
      var e = EDGES.filter(function (x) { return x.id === pair[0]; })[0];
      setEdgeOn(e, pair[1]);
      // flecha de la punta correcta segun el sentido
      if (e.arrow !== &quot;none&quot; &amp;&amp; e.arrow !== &quot;both&quot;) {
        e.el.setAttribute(&quot;marker-end&quot;, pair[1] > 0 ? &quot;url(#aho)&quot; : &quot;&quot;);
        e.el.setAttribute(&quot;marker-start&quot;, pair[1] < 0 ? &quot;url(#aho)&quot; : &quot;&quot;);
      }
    });
  }

  /* ---------- panel ---------- */
  var body = $(&quot;#panel-body&quot;);
  function setMode(m) {
    st.mode = m; st.sel = null; stopPlay(); clearFocus();
    $(&quot;#m-comp&quot;).setAttribute(&quot;aria-pressed&quot;, m === &quot;comp&quot;); $(&quot;#m-flow&quot;).setAttribute(&quot;aria-pressed&quot;, m === &quot;flow&quot;);
    if (m === &quot;flow&quot;) { st.flow = null; st.step = 0; }
    render();
  }
  function pickNode(id) {
    if (st.mode !== &quot;comp&quot;) { st.mode = &quot;comp&quot;; stopPlay(); $(&quot;#m-comp&quot;).setAttribute(&quot;aria-pressed&quot;, &quot;true&quot;); $(&quot;#m-flow&quot;).setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;); }
    st.sel = id; focusNode(id, true); render();
  }
  function connections(id) {
    return EDGES.filter(function (e) { return e.a === id || e.b === id; }).map(function (e) {
      var other = e.a === id ? e.b : e.a;
      return &quot;<li><b>&quot; + NODES[other].title + &quot;</b> &quot; + e.desc + &quot;</li>&quot;;
    }).join(&quot;&quot;);
  }
  function render() {
    var h = &quot;&quot;;
    if (st.mode === &quot;comp&quot;) {
      if (!st.sel) {
        h = '<div class=&quot;kicker&quot;>Vista general</div><h2>Tres servicios, una puerta de entrada</h2>' +
          &quot;<p>El navegador solo habla con el front. nginx reparte cada ruta al servicio que corresponde, y cada servicio tiene su propia base de datos.</p>&quot; +
          &quot;<ul><li>Los tres servicios validan el mismo token, que firma <b>usuarios-service</b>.</li><li><b>trivia-service</b> usa WebSocket y RabbitMQ para que todas las réplicas lleguen a todos los jugadores.</li><li>Solo <b>cursos-service</b> llama a la IA, y valida lo que ella propone.</li><li>Ganar trivias da gotas y completar roadmaps da semillas: el <b>jardín</b> las junta.</li></ul>&quot; +
          '<p class=&quot;hint&quot;>Haz clic en cualquier componente para ver sus detalles, o cambia a <b>Flujos</b> para ver cómo viaja una petición.</p>';
      } else {
        var d = DETAIL[st.sel];
        h = '<div class=&quot;kicker&quot;>' + d.kicker + &quot;</div><h2>&quot; + d.title + &quot;</h2><p>&quot; + d.text + &quot;</p>&quot;;
        h += '<dl class=&quot;facts&quot;>' + d.facts.map(function (f) { return &quot;<dt>&quot; + f[0] + &quot;</dt><dd>&quot; + f[1] + &quot;</dd>&quot;; }).join(&quot;&quot;) + &quot;</dl>&quot;;
        h += '<div class=&quot;sec&quot;>Qué hace</div><ul>' + d.bullets.map(function (b) { return &quot;<li>&quot; + b + &quot;</li>&quot;; }).join(&quot;&quot;) + &quot;</ul>&quot;;
        h += '<div class=&quot;sec&quot;>Se conecta con</div><ul class=&quot;links&quot;>' + connections(st.sel) + &quot;</ul>&quot;;
        h += '<div class=&quot;row&quot; style=&quot;margin-top:14px&quot;><button class=&quot;btn&quot; id=&quot;back&quot; type=&quot;button&quot;>Ver todo</button>';
        if (d.repo) h += '<a class=&quot;btn&quot; style=&quot;text-decoration:none;color:var(--text)&quot; target=&quot;_blank&quot; rel=&quot;noopener&quot; href=&quot;https://github.com/Grow-Link/' + d.repo + '&quot;>Abrir repositorio</a>';
        h += &quot;</div>&quot;;
      }
    } else if (!st.flow) {
      h = '<div class=&quot;kicker&quot;>Flujos</div><h2>¿Qué quieres recorrer?</h2><p class=&quot;hint&quot;>Cada flujo ilumina el camino que sigue la petición, paso a paso.</p><div class=&quot;flowlist&quot;>' +
        FLOWS.map(function (f) { return '<button type=&quot;button&quot; data-flow=&quot;' + f.id + '&quot;><b>' + f.title + &quot;</b><span>&quot; + f.sub + &quot; · &quot; + f.steps.length + &quot; pasos</span></button>&quot;; }).join(&quot;&quot;) + &quot;</div>&quot;;
    } else {
      var f = FLOWS.filter(function (x) { return x.id === st.flow; })[0], s = f.steps[st.step];
      h = '<div class=&quot;kicker&quot;>' + f.title + '</div><div class=&quot;stepno&quot;>Paso ' + (st.step + 1) + &quot; de &quot; + f.steps.length + &quot;</div>&quot;;
      h += '<div class=&quot;progress&quot;>' + f.steps.map(function (_, i) { return &quot;<i class='&quot; + (i < st.step ? &quot;done&quot; : i === st.step ? &quot;cur&quot; : &quot;&quot;) + &quot;'></i>&quot;; }).join(&quot;&quot;) + &quot;</div>&quot;;
      h += &quot;<h2>&quot; + s.t + &quot;</h2><p>&quot; + s.d + &quot;</p>&quot;;
      h += '<div class=&quot;row&quot; style=&quot;margin-top:16px&quot;><button class=&quot;btn&quot; id=&quot;prev&quot; type=&quot;button&quot;' + (st.step === 0 ? &quot; disabled&quot; : &quot;&quot;) + '>Anterior</button>' +
        '<button class=&quot;btn pri&quot; id=&quot;next&quot; type=&quot;button&quot;' + (st.step === f.steps.length - 1 ? &quot; disabled&quot; : &quot;&quot;) + '>Siguiente</button>' +
        '<button class=&quot;btn&quot; id=&quot;play&quot; type=&quot;button&quot;>' + (st.playing ? &quot;Pausar&quot; : &quot;Reproducir&quot;) + &quot;</button>&quot; +
        '<button class=&quot;btn&quot; id=&quot;all&quot; type=&quot;button&quot; style=&quot;margin-left:auto&quot;>Otros flujos</button></div>';
      focusStep(s);
    }
    body.innerHTML = h;
    var b = $(&quot;#back&quot;); if (b) b.onclick = function () { st.sel = null; clearFocus(); render(); };
    Array.prototype.forEach.call(body.querySelectorAll(&quot;[data-flow]&quot;), function (btn) { btn.onclick = function () { st.flow = btn.getAttribute(&quot;data-flow&quot;); st.step = 0; render(); }; });
    var pv = $(&quot;#prev&quot;), nx = $(&quot;#next&quot;), pl = $(&quot;#play&quot;), al = $(&quot;#all&quot;);
    if (pv) pv.onclick = function () { stopPlay(); go(-1); };
    if (nx) nx.onclick = function () { stopPlay(); go(1); };
    if (pl) pl.onclick = function () { st.playing ? stopPlay() : startPlay(); };
    if (al) al.onclick = function () { stopPlay(); st.flow = null; clearFocus(); render(); };
  }
  function go(d) {
    var f = FLOWS.filter(function (x) { return x.id === st.flow; })[0];
    var n = st.step + d; if (n < 0 || n >= f.steps.length) return;
    st.step = n; render();
  }
  function startPlay() {
    var f = FLOWS.filter(function (x) { return x.id === st.flow; })[0];
    if (st.step >= f.steps.length - 1) st.step = 0;
    st.playing = true; render();
    st.timer = setInterval(function () {
      if (st.step >= f.steps.length - 1) { stopPlay(); render(); return; }
      st.step++; render();
    }, 4500);
  }
  function stopPlay() { st.playing = false; if (st.timer) { clearInterval(st.timer); st.timer = null; } }

  /* ---------- calidad ---------- */
  $(&quot;#qgrid&quot;).innerHTML = QUALITY.map(function (q, i) {
    return '<article class=&quot;qcard&quot;><div class=&quot;kicker&quot;>' + q.k + &quot;</div><h3>&quot; + q.t + &quot;</h3><p>&quot; + q.p + &quot;</p><details&quot; + (i === 0 ? &quot; open&quot; : &quot;&quot;) + &quot;><summary>Cómo está resuelto</summary><ul>&quot; +
      q.l.map(function (x) { return &quot;<li>&quot; + x + &quot;</li>&quot;; }).join(&quot;&quot;) + &quot;</ul></details></article>&quot;;
  }).join(&quot;&quot;);

  /* ---------- despliegue ---------- */
  var pipeStep = 0;
  function renderPipe() {
    $(&quot;#pipe&quot;).innerHTML = PIPE.map(function (p, i) {
      return '<button type=&quot;button&quot; data-i=&quot;' + i + '&quot; aria-pressed=&quot;' + (i === pipeStep) + '&quot;><small>' + p.k + &quot;</small><b>&quot; + p.t + &quot;</b></button>&quot;;
    }).join(&quot;&quot;);
    var p = PIPE[pipeStep];
    $(&quot;#pipe-detail&quot;).innerHTML = '<div class=&quot;kicker&quot; style=&quot;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)&quot;>' + p.k + &quot;</div><h3>&quot; + p.t + &quot;</h3><p>&quot; + p.d + &quot;</p><ul>&quot; +
      p.l.map(function (x) { return &quot;<li>&quot; + x + &quot;</li>&quot;; }).join(&quot;&quot;) + '</ul><div class=&quot;row&quot; style=&quot;margin-top:14px&quot;><button class=&quot;btn&quot; id=&quot;pp&quot; type=&quot;button&quot;' + (pipeStep === 0 ? &quot; disabled&quot; : &quot;&quot;) + '>Anterior</button><button class=&quot;btn pri&quot; id=&quot;pn&quot; type=&quot;button&quot;' + (pipeStep === PIPE.length - 1 ? &quot; disabled&quot; : &quot;&quot;) + &quot;>Siguiente</button></div>&quot;;
    Array.prototype.forEach.call($(&quot;#pipe&quot;).querySelectorAll(&quot;button&quot;), function (b) { b.onclick = function () { pipeStep = +b.getAttribute(&quot;data-i&quot;); renderPipe(); }; });
    $(&quot;#pp&quot;).onclick = function () { pipeStep--; renderPipe(); };
    $(&quot;#pn&quot;).onclick = function () { pipeStep++; renderPipe(); };
  }

  /* ---------- pestañas, tema y teclado ---------- */
  var TABS = [&quot;arq&quot;, &quot;cal&quot;, &quot;dep&quot;];
  function showTab(t) {
    TABS.forEach(function (k) {
      $(&quot;#&quot; + k).hidden = k !== t;
      $(&quot;#t-&quot; + k).setAttribute(&quot;aria-selected&quot;, k === t);
    });
    try { history.replaceState(null, &quot;&quot;, &quot;#&quot; + t); } catch (e) { /* sin acceso al historial */ }
  }
  Array.prototype.forEach.call(document.querySelectorAll(&quot;[data-tab]&quot;), function (b) { b.onclick = function () { showTab(b.getAttribute(&quot;data-tab&quot;)); }; });
  $(&quot;#m-comp&quot;).onclick = function () { setMode(&quot;comp&quot;); };
  $(&quot;#m-flow&quot;).onclick = function () { setMode(&quot;flow&quot;); };
  $(&quot;#theme&quot;).onclick = function () {
    var root = document.documentElement, cur = root.getAttribute(&quot;data-theme&quot;);
    var dark = cur ? cur === &quot;dark&quot; : window.matchMedia(&quot;(prefers-color-scheme: dark)&quot;).matches;
    root.setAttribute(&quot;data-theme&quot;, dark ? &quot;light&quot; : &quot;dark&quot;);
  };
  document.addEventListener(&quot;keydown&quot;, function (ev) {
    if (ev.target &amp;&amp; /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName)) return;
    if (ev.key === &quot;1&quot; || ev.key === &quot;2&quot; || ev.key === &quot;3&quot;) { showTab(TABS[+ev.key - 1]); return; }
    if (ev.key === &quot;Escape&quot;) { if (st.mode === &quot;comp&quot;) { st.sel = null; clearFocus(); render(); } else if (st.flow) { stopPlay(); st.flow = null; clearFocus(); render(); } return; }
    if (!$(&quot;#arq&quot;).hidden &amp;&amp; st.mode === &quot;flow&quot; &amp;&amp; st.flow) {
      if (ev.key === &quot;ArrowRight&quot;) { stopPlay(); go(1); } else if (ev.key === &quot;ArrowLeft&quot;) { stopPlay(); go(-1); }
    }
  });

  buildSvg(); render(); renderPipe();
  var h0 = (location.hash || &quot;&quot;).replace(&quot;#&quot;, &quot;&quot;);
  if (TABS.indexOf(h0) > -1) showTab(h0);
})();

<style>
/* Concepto: guion de exposición. Portada con el QR, una línea de tiempo con todo el recorrido por la app, el detalle de cada historia y el sprint.
   Mismos colores y tipografías que la presentación de arquitectura y el front de GrowLink. */
:root {
  --bg: #F7F9FA; --card: #FFFFFF; --card2: #EEF2F6; --text: #0B1F3A; --text2: #566683; --line: #DDE4ED;
  --blue: #1E73E8; --teal: #0B9F8A; --green: #1F9D55; --amber: #B7791F;
  --blue-soft: #E3EEFD; --teal-soft: #DDF5F0; --green-soft: #DDF3E5; --amber-soft: #FBF0D9; --onblue: #FFFFFF;
  --display: 'Bricolage Grotesque', 'Segoe UI', sans-serif; --body: 'Plus Jakarta Sans', 'Segoe UI', sans-serif; --mono: 'JetBrains Mono', Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme=&quot;light&quot;]) {
  --bg: #081629; --card: #0F2240; --card2: #132A47; --text: #E2EBF6; --text2: #9DB3CE; --line: #1C3254;
  --blue: #5AA0FF; --teal: #12C2A8; --green: #4CE07E; --amber: #F2C26B;
  --blue-soft: #14325E; --teal-soft: #0F3A3E; --green-soft: #12392B; --amber-soft: #3A2E12; --onblue: #06182F; color-scheme: dark; } }
:root[data-theme=&quot;dark&quot;] {
  --bg: #081629; --card: #0F2240; --card2: #132A47; --text: #E2EBF6; --text2: #9DB3CE; --line: #1C3254;
  --blue: #5AA0FF; --teal: #12C2A8; --green: #4CE07E; --amber: #F2C26B;
  --blue-soft: #14325E; --teal-soft: #0F3A3E; --green-soft: #12392B; --amber-soft: #3A2E12; --onblue: #06182F; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 15px; line-height: 1.55; padding-inline: 16px; padding-block: 0 56px; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1240px; margin-inline: auto; }
h1, h2, h3 { font-family: var(--display); line-height: 1.12; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--blue); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

/* barra superior */
header.top { display: flex; align-items: center; gap: 14px 20px; flex-wrap: wrap; padding-block: 16px 12px; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.brand .logo { height: 48px; width: auto; flex: none; }
.brand b { font-family: var(--display); font-size: 20px; font-weight: 800; display: block; line-height: 1.1; }
.brand span { color: var(--text2); font-size: 12.5px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--text); }
.btn:hover { border-color: var(--blue); }
.btn.pri { background: var(--blue); border-color: var(--blue); color: var(--onblue); }
.btn.pri:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .4; cursor: default; }
nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 24px; overflow-x: auto; }
nav.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 16px; font-weight: 600; font-size: 15px; color: var(--text2); white-space: nowrap; margin-bottom: -1px; }
nav.tabs button[aria-selected=&quot;true&quot;] { color: var(--text); border-bottom-color: var(--blue); }
.view[hidden] { display: none !important; }

/* portada */
.cover { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 40px; align-items: center; padding-block: 12px 24px; }
@media (max-width: 900px) { .cover { grid-template-columns: minmax(0, 1fr); gap: 28px; } }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); margin-bottom: 14px; }
.cover h1 { font-size: clamp(40px, 6.4vw, 76px); font-weight: 800; letter-spacing: -0.02em; }
.cover h1 em { font-style: normal; color: var(--blue); }
.cover .lead { font-size: 18px; color: var(--text2); max-width: 54ch; margin-top: 18px; }
.cover .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 30px; }
.stat { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 16px; min-width: 112px; }
.stat b { font-family: var(--display); font-size: 28px; font-weight: 800; display: block; line-height: 1.1; }
.stat span { font-size: 12.5px; color: var(--text2); }
.qr { justify-self: center; text-align: center; }
.qr .plate { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 18px; width: 300px; max-width: 100%; box-shadow: 0 10px 30px rgba(11,31,58,.12); }
.qr .plate img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.qr p { margin-top: 14px; font-weight: 600; }
.qr small { display: block; color: var(--text2); font-size: 12.5px; margin-top: 4px; word-break: break-all; }
.users { margin-top: 34px; border-top: 1px solid var(--line); padding-top: 20px; }
.users h3 { font-size: 15px; font-family: var(--body); font-weight: 700; margin-bottom: 12px; }
.userlist { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.user { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 14px; }
.user b { display: block; }
.user span { font-size: 13px; color: var(--text2); }
.user .rol { margin-top: 8px; display: table; }

/* chips de rol */
.rol { display: inline-block; font-family: var(--mono); font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 600; background: var(--blue-soft); color: var(--blue); }
.rol.publicador { background: var(--teal-soft); color: var(--teal); }
.rol.admin { background: var(--amber-soft); color: var(--amber); }
.rol.todos { background: var(--card2); color: var(--text2); }

/* recorrido */
.tour { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 22px; align-items: start; }
@media (max-width: 900px) { .tour { grid-template-columns: minmax(0, 1fr); } }
.side { position: sticky; top: 8px; max-height: calc(100vh - 24px); overflow-y: auto; border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px; }
@media (max-width: 900px) { .side { position: static; max-height: 260px; } }
.progress { padding: 4px 6px 12px; }
.progress .bar { height: 6px; background: var(--card2); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.progress .bar i { display: block; height: 100%; width: 0; background: var(--teal); transition: width .25s; }
.progress small { color: var(--text2); font-size: 12.5px; }
.epic-t { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--text2); padding: 12px 6px 4px; }
.item { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; background: none; border-radius: 8px; padding: 7px 8px; font-size: 13.5px; }
.item:hover { background: var(--card2); }
.item[aria-current=&quot;true&quot;] { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
.item .c { font-family: var(--mono); font-size: 11px; color: var(--text2); width: 46px; flex: none; }
.item[aria-current=&quot;true&quot;] .c { color: var(--blue); }
.item .t { flex: 1; min-width: 0; }
.item .ok { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; display: grid; place-items: center; font-size: 10px; color: transparent; }
.item.done .ok { background: var(--teal); border-color: var(--teal); color: var(--onblue); }

.hu { border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 28px; min-width: 0; }
@media (max-width: 600px) { .hu { padding: 18px; } }
.hu-top { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.code { font-family: var(--mono); font-weight: 600; font-size: 13px; color: var(--blue); }
.hu h2 { font-size: clamp(28px, 4vw, 40px); font-weight: 800; letter-spacing: -0.01em; }
.story { font-size: 18px; margin-top: 14px; max-width: 62ch; }
.story b { color: var(--blue); font-weight: 600; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-top: 24px; }
@media (max-width: 760px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.box { border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; background: var(--bg); min-width: 0; }
.box h3 { font-family: var(--mono); font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--text2); margin-bottom: 10px; font-weight: 600; }
.gh p { margin-top: 6px; }
.gh .kw { font-weight: 700; color: var(--teal); }
.steps { margin: 0; padding-left: 22px; }
.steps li { margin-top: 7px; }
.steps li::marker { color: var(--blue); font-weight: 700; font-family: var(--mono); }
.inside { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.inside h3 { font-family: var(--mono); font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--text2); font-weight: 600; margin-right: 6px; }
.tag { font-family: var(--mono); font-size: 12px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--card2); color: var(--text); overflow-wrap: anywhere; }
.nav { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--line); }
.nav .sp { margin-left: auto; }
.mark { background: var(--card); }
.mark[aria-pressed=&quot;true&quot;] { background: var(--teal); border-color: var(--teal); color: var(--onblue); }
.hint { color: var(--text2); font-size: 12.5px; margin-top: 12px; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--card2); }

/* resumen */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.filters button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: 13.5px; font-weight: 600; color: var(--text2); }
.filters button[aria-pressed=&quot;true&quot;] { background: var(--blue); border-color: var(--blue); color: var(--onblue); }
.epic-block { margin-bottom: 26px; }
.epic-block h2 { font-size: 24px; font-weight: 800; }
.epic-block .sub { color: var(--text2); font-size: 13.5px; margin: 2px 0 12px; font-family: var(--mono); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.mini { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.mini:hover { border-color: var(--blue); }
.mini .row { display: flex; align-items: center; gap: 8px; }
.mini .row .code { margin-right: auto; }
.mini b { font-family: var(--display); font-size: 17px; font-weight: 700; line-height: 1.2; }
.mini.done { border-color: var(--teal); }

/* cronómetro */
.timer { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 6px 4px 14px; }
.timer b { font-family: var(--mono); font-size: 15px; font-weight: 600; min-width: 3.4em; font-variant-numeric: tabular-nums; }
.timer.low b { color: var(--amber); }
.timer.over b { color: #D64545; }
.timer button { border: 0; background: var(--card2); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 600; }
.timer button:hover { background: var(--blue-soft); }
/* guion */
.plan { display: grid; gap: 12px; }
.blk { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 16px; border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 16px 18px; }
@media (max-width: 600px) { .blk { grid-template-columns: minmax(0, 1fr); gap: 8px; } }
.blk .when { font-family: var(--mono); font-size: 13px; color: var(--text2); }
.blk .when b { display: block; font-size: 20px; color: var(--text); font-family: var(--display); font-weight: 800; }
.blk h3 { font-size: 20px; font-weight: 800; }
.blk p { color: var(--text2); margin-top: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chips button { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); background: var(--card2); border-radius: 8px; padding: 4px 10px; }
.chips button:hover { border-color: var(--blue); color: var(--blue); }
.total { margin-top: 14px; color: var(--text2); font-size: 13.5px; }
/* sprint */
.sprint { display: grid; grid-template-columns: minmax(0, 560px) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 900px) { .sprint { grid-template-columns: minmax(0, 1fr); } }
.sprint figure { margin: 0; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
.sprint figure img { display: block; width: 100%; height: auto; }
.sprint h2 { font-size: 30px; font-weight: 800; }
.sprint .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 16px; }
.sprint p.l { color: var(--text2); margin-top: 10px; max-width: 56ch; }

/* línea de tiempo */
.tl { list-style: none; margin: 0; padding: 0; position: relative; }
.tl::before { content: &quot;&quot;; position: absolute; left: 17px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.act { position: relative; padding-left: 56px; padding-bottom: 28px; }
.act .dot { position: absolute; left: 0; top: 0; width: 36px; height: 36px; border-radius: 50%; background: var(--blue); color: var(--onblue); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 17px; }
.acthead { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; min-height: 36px; }
.acthead h2 { font-size: 24px; font-weight: 800; }
.clock { font-family: var(--mono); font-size: 12.5px; color: var(--text2); margin-left: auto; }
.actnote { color: var(--text2); margin-top: 4px; max-width: 70ch; }
.steps2 { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
.step { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 14px; min-width: 0; }
.step:hover { border-color: var(--blue); }
.step .n { font-family: var(--mono); font-size: 12px; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--blue); color: var(--blue); display: grid; place-items: center; flex: none; font-weight: 600; }
.step .cd { font-family: var(--mono); font-size: 12px; color: var(--text2); width: 52px; flex: none; }
.step .tt { flex: 1; min-width: 0; font-weight: 600; }
.step.opt { border-style: dashed; background: transparent; }
.step.done { border-color: var(--teal); }
.step.done .n { background: var(--teal); border-color: var(--teal); color: var(--onblue); }
.item.opt .t { color: var(--text2); }
@media (max-width: 600px) { .act { padding-left: 46px; } .acthead h2 { font-size: 20px; } .clock { margin-left: 0; } .step .cd { display: none; } }
</style>

</head>

  if (v === &quot;recorrido&quot;) { renderList(); renderHU(); }
}

document.querySelectorAll(&quot;nav.tabs button&quot;).forEach(function (b) { b.onclick = function () { setView(b.getAttribute(&quot;data-view&quot;)); }; });
$(&quot;start&quot;).onclick = function () { setView(&quot;linea&quot;); };
$(&quot;list&quot;).addEventListener(&quot;click&quot;, function (e) { var b = e.target.closest(&quot;.item&quot;); if (b) go(+b.getAttribute(&quot;data-i&quot;)); });
$(&quot;tl&quot;).addEventListener(&quot;click&quot;, function (e) { var b = e.target.closest(&quot;.step&quot;); if (b) go(+b.getAttribute(&quot;data-i&quot;)); });
document.addEventListener(&quot;keydown&quot;, function (e) {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (view !== &quot;recorrido&quot;) return;
  if (e.key === &quot;ArrowRight&quot;) { go(cur + 1); e.preventDefault(); }
  else if (e.key === &quot;ArrowLeft&quot;) { go(cur - 1); e.preventDefault(); }
  else if (e.key === &quot;m&quot; || e.key === &quot;M&quot;) { toggleMark(); }
});

// tema: claro / oscuro / sistema
(function () {
  var root = document.documentElement, t = $(&quot;theme&quot;);
  var pref = null; try { pref = localStorage.getItem(&quot;gl-theme&quot;); } catch (e) {}
  if (pref) root.setAttribute(&quot;data-theme&quot;, pref);
  t.onclick = function () {
    var dark = root.getAttribute(&quot;data-theme&quot;) === &quot;dark&quot; || (!root.getAttribute(&quot;data-theme&quot;) &amp;&amp; window.matchMedia &amp;&amp; matchMedia(&quot;(prefers-color-scheme: dark)&quot;).matches);
    var next = dark ? &quot;light&quot; : &quot;dark&quot;;
    root.setAttribute(&quot;data-theme&quot;, next);
    try { localStorage.setItem(&quot;gl-theme&quot;, next); } catch (e) {}
  };
})();


// cronómetro de 15 minutos
(function () {
  var total = 15 * 60, left = total, timer = null, box = $(&quot;timer&quot;);
  function draw() {
    var a = Math.abs(left), m = Math.floor(a / 60), s = a % 60;
    $(&quot;tTime&quot;).textContent = (left < 0 ? &quot;+&quot; : &quot;&quot;) + m + &quot;:&quot; + (&quot;0&quot; + s).slice(-2);
    box.className = &quot;timer&quot; + (left <= 0 ? &quot; over&quot; : left <= 120 ? &quot; low&quot; : &quot;&quot;);
  }
  function tick() { left--; draw(); }
  $(&quot;tGo&quot;).onclick = function () {
    if (timer) { clearInterval(timer); timer = null; $(&quot;tGo&quot;).textContent = &quot;Seguir&quot;; }
    else { timer = setInterval(tick, 1000); $(&quot;tGo&quot;).textContent = &quot;Pausar&quot;; }
  };
  $(&quot;tReset&quot;).onclick = function () { if (timer) { clearInterval(timer); timer = null; } left = total; $(&quot;tGo&quot;).textContent = &quot;Iniciar&quot;; draw(); };
  draw();
})();

renderStats(); renderList(); renderHU();
var h = (location.hash || &quot;&quot;).replace(&quot;#&quot;, &quot;&quot;);
if ([&quot;recorrido&quot;, &quot;linea&quot;, &quot;sprint&quot;].indexOf(h) >= 0) setView(h);
</script>

<script>
(function () {
  "use strict";
  var root = document.documentElement;
  var $ = function (id) { return document.getElementById(id); };
  var DOCS = {
    arq: { hash: "arquitectura", title: "GrowLink · Arquitectura" },
    hu:  { hash: "historias",    title: "GrowLink · Historias de usuario" }
  };
  var IDS = Object.keys(DOCS);

  function show(id, focusFrame) {
    root.setAttribute("data-doc", id);
    IDS.forEach(function (k) {
      $("p-" + k).hidden = k !== id;
      $("d-" + k).setAttribute("aria-selected", k === id ? "true" : "false");
      $("d-" + k).tabIndex = k === id ? 0 : -1;
    });
    document.title = DOCS[id].title;
    try { history.replaceState(null, "", "#" + DOCS[id].hash); } catch (e) { /* sin acceso al historial */ }
    // así los atajos de teclado de cada documento funcionan apenas se cambia
    if (focusFrame) { var w = $("f-" + id).contentWindow; if (w) w.focus(); }
  }
  function fromHash() {
    var h = (location.hash || "").replace("#", "");
    for (var i = 0; i < IDS.length; i++) if (DOCS[IDS[i]].hash === h) return IDS[i];
    return null;
  }

  IDS.forEach(function (k) { $("d-" + k).onclick = function () { show(k, true); }; });
  document.querySelector(".docs").addEventListener("keydown", function (ev) {
    if (ev.key !== "ArrowRight" && ev.key !== "ArrowLeft") return;
    var i = IDS.indexOf(root.getAttribute("data-doc"));
    var next = IDS[(i + (ev.key === "ArrowRight" ? 1 : IDS.length - 1)) % IDS.length];
    show(next, false); $("d-" + next).focus(); ev.preventDefault();
  });
  $("theme").onclick = function () {
    var cur = root.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    glSetTheme(dark ? "light" : "dark");
  };
  window.addEventListener("hashchange", function () { var d = fromHash(); if (d) show(d, false); });

  // por si algún iframe terminó de cargar antes de que se registrara el onload
  Array.prototype.forEach.call(document.querySelectorAll(".pane iframe"), function (f) {
    if (f.contentDocument && f.contentDocument.readyState === "complete") glFrameLoaded(f);
  });
  show(fromHash() || "arq", false);
})();
</script>
